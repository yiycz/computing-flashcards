site_name: Computing Flashcards
site_description: Computing flashcards for focused revision.
site_url: !ENV [SITE_URL, '']

docs_dir: docs
site_dir: site
use_directory_urls: false

exclude_docs: |
  notes/**
  flashcards.md
  assets/images/**
  assets/styles.css
  assets/app.js

theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html

plugins: []

hooks:
  - hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Flashcards: index.md

